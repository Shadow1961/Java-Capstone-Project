on: [push, pull_request]

jobs:
  compile-backend:
  runs-on: ubuntu-latest
  name: Compile Backend Code
  steps:
    - uses actions/checkout@v3

    - name: Set up JDK

    with:
      distribution: 'temurin'
      java-version: '23'

      - name: Compile with Maven
    run: |
      cd app
      ./mvnw clean compile